<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Generator Link Undangan</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #1e2e52;
        color: aliceblue;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px 0;
    }
    .panel {
        background-color: #ffffff10;
        padding: 25px 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 380px;
        text-align: center;
    }
    input, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: none;
        font-family: inherit;
        font-size: 0.9rem;
    }
    textarea {
        resize: vertical;
        min-height: 130px;
        text-align: left;
    }
    label {
        display: block;
        text-align: left;
        font-size: 0.8rem;
        opacity: 0.85;
        margin-top: 12px;
        margin-bottom: 2px;
    }
    button {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background-color: aliceblue;
        color: #1e2e52;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
    }
    button:hover { opacity: 0.85; }
    .btn-wa {
        background-color: #25D366;
        color: #073b1c;
    }
    .btn-reset {
        background-color: transparent;
        color: aliceblue;
        border: 1px solid #ffffff50;
        font-weight: normal;
        font-size: 0.75rem;
        padding: 6px;
    }
    #pesanError { color: #ff6b6b; font-size: 0.85rem; }
    #hasilLink { display: none; margin-top: 10px; }
    .catatan {
        font-size: 0.7rem;
        opacity: 0.7;
        text-align: left;
        margin-top: 4px;
    }
    #statusSimpan {
        font-size: 0.7rem;
        opacity: 0.6;
        text-align: left;
        margin-top: -4px;
        margin-bottom: 8px;
        font-style: italic;
    }
</style>
</head>
<body>

    <div class="panel" id="gerbangKode">
        <h2>Masukkan Kode Akses</h2>
        <input type="password" id="inputKode" placeholder="Kode rahasia">
        <button id="btnMasuk">Masuk</button>
        <p id="pesanError"></p>
    </div>

    <div class="panel" id="panelGenerator" style="display:none;">
        <h2>Generator Link Tamu</h2>

        <label for="inputNamaTamu">Nama tamu</label>
        <input type="text" id="inputNamaTamu" placeholder="Misal: Bapak Andi">

        <label for="inputNoWa">Nomor WhatsApp tamu (opsional)</label>
        <input type="text" id="inputNoWa" placeholder="Misal: 081234567890">
        <p class="catatan">Boleh dikosongkan kalau cuma mau salin link/pesan manual.</p>

        <label for="templatePesan">Template pesan (bisa diedit, otomatis tersimpan)</label>
        <textarea id="templatePesan"></textarea>
        <p id="statusSimpan"></p>
        <button id="btnResetTemplate" class="btn-reset">Reset ke Template Default</button>

        <button id="btnGenerate">Generate</button>

        <div id="hasilLink">
            <label for="outputLink">Link undangan</label>
            <input type="text" id="outputLink" readonly>
            <button id="btnCopyLink">Salin Link</button>

            <label for="outputPesan">Pesan lengkap</label>
            <textarea id="outputPesan" readonly></textarea>
            <button id="btnCopyPesan">Salin Pesan</button>

            <button id="btnBukaWa" class="btn-wa">Buka WhatsApp (Pesan Sudah Terisi)</button>
        </div>
    </div>

<script>
    const KODE_RAHASIA = "BiruOrange-201026"; // GANTI dengan kode kamu sendiri
    const KUNCI_TEMPLATE = "templatePesanUndangan"; // kunci penyimpanan di localStorage

    const TEMPLATE_DEFAULT = `Assalamu'alaikum {nama},

Dengan segala hormat, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di acara pernikahan kami.

Undangan lengkap bisa dilihat di sini:
{link}

Mohon maaf perihal undangan hanya disampaikan melalui pesan ini. Kami tunggu kehadirannya 🙏`;

    const templatePesanEl = document.getElementById("templatePesan");
    const statusSimpanEl = document.getElementById("statusSimpan");

    // Muat template tersimpan (kalau ada), atau pakai default
    function muatTemplate() {
        const tersimpan = localStorage.getItem(KUNCI_TEMPLATE);
        templatePesanEl.value = tersimpan !== null ? tersimpan : TEMPLATE_DEFAULT;
    }
    muatTemplate();

    // Simpan otomatis setiap kali diketik/diubah
    let timeoutSimpan;
    templatePesanEl.addEventListener("input", () => {
        clearTimeout(timeoutSimpan);
        statusSimpanEl.textContent = "";
        timeoutSimpan = setTimeout(() => {
            localStorage.setItem(KUNCI_TEMPLATE, templatePesanEl.value);
            statusSimpanEl.textContent = "Tersimpan ✓";
        }, 500);
    });

    document.getElementById("btnResetTemplate").addEventListener("click", () => {
        if (confirm("Kembalikan template ke versi default? Perubahan yang tersimpan akan hilang.")) {
            templatePesanEl.value = TEMPLATE_DEFAULT;
            localStorage.setItem(KUNCI_TEMPLATE, TEMPLATE_DEFAULT);
            statusSimpanEl.textContent = "Direset ke default ✓";
        }
    });

    document.getElementById("btnMasuk").addEventListener("click", () => {
        const kode = document.getElementById("inputKode").value;
        if (kode === KODE_RAHASIA) {
            document.getElementById("gerbangKode").style.display = "none";
            document.getElementById("panelGenerator").style.display = "block";
        } else {
            document.getElementById("pesanError").textContent = "Kode salah, coba lagi.";
        }
    });

    let linkTerakhir = "";
    let pesanTerakhir = "";
    let nomorWaTerakhir = "";

    document.getElementById("btnGenerate").addEventListener("click", () => {
        const nama = document.getElementById("inputNamaTamu").value.trim();
        if (!nama) { alert("Isi nama tamu dulu ya."); return; }

        const baseUrl = location.origin + location.pathname.replace("panel-r7f3q2.html", "web-undangan.html");
        const link = `${baseUrl}?to=${encodeURIComponent(nama)}`;

        const template = templatePesanEl.value;
        const pesan = template.replaceAll("{nama}", nama).replaceAll("{link}", link);

        linkTerakhir = link;
        pesanTerakhir = pesan;

        document.getElementById("outputLink").value = link;
        document.getElementById("outputPesan").value = pesan;
        document.getElementById("hasilLink").style.display = "block";

        // Normalisasi nomor WA: buang spasi/strip/plus, ubah awalan 0 jadi 62
        let noWa = document.getElementById("inputNoWa").value.trim();
        noWa = noWa.replace(/[\s\-\+]/g, "");
        if (noWa.startsWith("0")) {
            noWa = "62" + noWa.slice(1);
        }
        nomorWaTerakhir = noWa;
    });

    document.getElementById("btnCopyLink").addEventListener("click", () => {
        navigator.clipboard.writeText(linkTerakhir);
        alert("Link berhasil disalin!");
    });

    document.getElementById("btnCopyPesan").addEventListener("click", () => {
        navigator.clipboard.writeText(pesanTerakhir);
        alert("Pesan berhasil disalin!");
    });

    document.getElementById("btnBukaWa").addEventListener("click", () => {
        const teksEncoded = encodeURIComponent(pesanTerakhir);
        let urlWa;
        if (nomorWaTerakhir) {
            urlWa = `https://wa.me/${nomorWaTerakhir}?text=${teksEncoded}`;
        } else {
            urlWa = `https://wa.me/?text=${teksEncoded}`;
        }
        window.open(urlWa, "_blank");
    });
</script>
</body>
</html>
